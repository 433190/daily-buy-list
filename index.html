<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaspreet · Expenses</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyCYtszBHTirQzuAmJhmh2SkqisYnL-0JKw",
    authDomain: "expense-tracker-c3638.firebaseapp.com",
    projectId: "expense-tracker-c3638",
    storageBucket: "expense-tracker-c3638.firebasestorage.app",
    messagingSenderId: "851054016055",
    appId: "1:851054016055:web:769f45050c7f159c9f71b2"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const STORAGE_KEY = "expenses_jaspreet";

  function saveLocal(month, data) {
    try {
      const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      stored[month] = data;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
    } catch (err) {
      console.warn("Local save failed", err);
    }
  }

  function loadLocal() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    } catch (err) {
      return {};
    }
  }

  const docRef = doc(db, "users", "jaspreet");

  window._saveData = async (month, data) => {
    try {
      await setDoc(docRef, { [month]: data }, { merge: true });
      saveLocal(month, data);
      return { source: "cloud" };
    } catch (err) {
      console.error("Cloud save failed", err);
      saveLocal(month, data);
      return { source: "local", error: err };
    }
  };

  window._loadData = async () => {
    try {
      const snap = await getDoc(docRef);
      return { source: "cloud", snap, data: loadLocal() };
    } catch (err) {
      console.error("Cloud load failed", err);
      return { source: "local", data: loadLocal(), error: err };
    }
  };

  function firebaseReady() {
    window._firebaseReady = true;
    document.dispatchEvent(new Event("firebase-ready"));
  }

  signInAnonymously(auth)
    .then(() => {
      console.log("Firebase anonymous auth OK");
      firebaseReady();
    })
    .catch(err => {
      console.warn("Firebase anonymous auth failed", err);
      firebaseReady();
    });
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1612;
    --paper: #f5f0e8;
    --warm: #e8dfc8;
    --gold: #c9a84c;
    --gold-dark: #a07830;
    --accent: #8b3a3a;
    --muted: #9a9080;
    --line: #d4c9b0;
    --shadow: rgba(26,22,18,0.12);
  }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }

  /* Subtle texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 28px,
        rgba(180,160,120,0.08) 28px,
        rgba(180,160,120,0.08) 29px
      );
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
  }

  /* ── Login ── */
  #login {
    background: white;
    border: 1px solid var(--line);
    border-top: 4px solid var(--gold);
    padding: 56px 48px;
    box-shadow: 0 8px 40px var(--shadow);
    animation: rise 0.5s ease both;
  }

  .brand {
    font-family: 'Playfair Display', serif;
    font-size: 11px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .login-title {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 700;
    line-height: 1.1;
    color: var(--ink);
    margin-bottom: 40px;
  }

  .login-title span {
    color: var(--gold);
  }

  .field {
    margin-bottom: 20px;
  }

  .field label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 14px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }

  .field input:focus {
    border-color: var(--gold);
    background: white;
  }

  .btn-primary {
    width: 100%;
    margin-top: 8px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 16px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .btn-primary:hover { background: var(--gold-dark); }
  .btn-primary:active { transform: scale(0.99); }

  .login-error {
    margin-top: 12px;
    font-size: 12px;
    color: var(--accent);
    text-align: center;
    display: none;
  }

  /* ── App ── */
  #app {
    display: none;
    animation: rise 0.4s ease both;
  }

  .app-header {
    background: var(--ink);
    color: var(--paper);
    padding: 28px 36px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }

  .app-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
  }

  .app-title small {
    display: block;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 4px;
  }

  .month-select {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--paper);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 8px 14px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
  }

  .month-select:focus, .month-select:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  .month-select option {
    background: var(--ink);
    color: var(--paper);
  }

  .sync-status {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--paper);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }

  /* ── Card ── */
  .card {
    background: white;
    border: 1px solid var(--line);
    border-top: none;
    box-shadow: 0 8px 40px var(--shadow);
    padding: 0 0 24px;
  }

  .rows-container {
    padding: 8px 0;
    min-height: 60px;
  }

  /* ── Expense Row ── */
  .expense-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 0;
    border-bottom: 1px solid var(--warm);
    animation: slideIn 0.2s ease both;
    position: relative;
  }

  .expense-row:last-child { border-bottom: none; }

  .expense-row input {
    background: transparent;
    border: none;
    outline: none;
    font-family: 'DM Mono', monospace;
    color: var(--ink);
    padding: 15px 20px;
    font-size: 14px;
    width: 100%;
  }

  .expense-row input.name-input {
    padding-left: 36px;
  }

  .row-number {
    position: absolute;
    left: 14px;
    font-size: 10px;
    color: var(--muted);
    pointer-events: none;
    font-style: italic;
  }

  .expense-row input.amount-input {
    text-align: right;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    max-width: 130px;
    padding-right: 8px;
  }

  .expense-row input::placeholder { color: var(--muted); }

  .amount-prefix {
    color: var(--muted);
    font-size: 12px;
    padding: 0 4px 0 0;
  }

  .delete-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--line);
    font-size: 18px;
    padding: 0 16px;
    line-height: 1;
    transition: color 0.15s;
  }

  .delete-btn:hover { color: var(--accent); }

  /* ── Footer of card ── */
  .card-footer {
    padding: 20px 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .total-bar {
    padding: 16px 20px;
    background: var(--warm);
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .total-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .total-amount {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--ink);
  }

  .total-amount .currency {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: var(--muted);
    vertical-align: super;
    margin-right: 2px;
  }

  .btn-add {
    background: none;
    border: 1px dashed var(--line);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 10px 18px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-add:hover {
    border-color: var(--gold);
    color: var(--gold-dark);
    background: rgba(201,168,76,0.04);
  }

  .btn-save {
    background: var(--gold);
    border: none;
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 11px 22px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-save:hover { background: var(--gold-dark); }
  .btn-save:active { transform: scale(0.98); }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--paper);
    padding: 14px 28px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 100;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .toast.success { border-left: 3px solid var(--gold); }
  .toast.error   { border-left: 3px solid var(--accent); }

  /* ── Loading state ── */
  .loading-rows {
    padding: 32px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.1em;
  }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid var(--line);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }

  /* ── Animations ── */
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    #login { padding: 40px 28px; }
    .app-header { padding: 20px 24px; flex-direction: column; align-items: flex-start; }
    .expense-row input.amount-input { max-width: 100px; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- Login -->
  <div id="login">
    <p class="brand">Personal Finance</p>
    <h1 class="login-title">Welcome,<br><span>Jaspreet.</span></h1>

    <div class="field">
      <label>Username</label>
      <input id="username" placeholder="Enter username" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password"
             onkeydown="if(event.key==='Enter') login()">
    </div>
    <button id="login-btn" class="btn-primary" onclick="login()">Sign In →</button>
    <p class="login-error" id="login-error">Incorrect credentials. Try again.</p>
  </div>

  <!-- App -->
  <div id="app">
    <div class="app-header">
      <div class="app-title">
        <small>Monthly Expenses</small>
        Jaspreet
      </div>
      <select class="month-select" id="month" onchange="loadData()">
        <option value="0">January</option>
        <option value="1">February</option>
        <option value="2">March</option>
        <option value="3">April</option>
        <option value="4">May</option>
        <option value="5">June</option>
        <option value="6">July</option>
        <option value="7">August</option>
        <option value="8">September</option>
        <option value="9">October</option>
        <option value="10">November</option>
        <option value="11">December</option>
      </select>
      <div class="sync-status" id="sync-status">Connecting…</div>
    </div>

    <div class="card">
      <div class="total-bar">
        <span class="total-label">Total</span>
        <span class="total-amount" id="total"><span class="currency">$</span>0.00</span>
      </div>

      <div class="rows-container" id="rows"></div>

      <div class="card-footer">
        <button class="btn-add" onclick="addRow()">
          <span>+</span> Add Expense
        </button>
        <button class="btn-save" onclick="save()">
          Save ↑
        </button>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const USER = "jaspreet";
  const PASS = "1234";
  const loginBtn = document.getElementById("login-btn");

  if (loginBtn) {
    loginBtn.disabled = true;
    loginBtn.textContent = "Connecting…";
  }

  const syncStatusEl = document.getElementById("sync-status");

  function setSyncStatus(text, type = "neutral") {
    if (!syncStatusEl) return;
    syncStatusEl.textContent = text;
    if (type === "cloud") {
      syncStatusEl.style.background = "rgba(76, 175, 80, 0.16)";
      syncStatusEl.style.color = "#fff";
      syncStatusEl.style.borderColor = "rgba(76, 175, 80, 0.4)";
    } else if (type === "local") {
      syncStatusEl.style.background = "rgba(255, 193, 7, 0.14)";
      syncStatusEl.style.color = "#fff";
      syncStatusEl.style.borderColor = "rgba(255, 193, 7, 0.4)";
    } else if (type === "error") {
      syncStatusEl.style.background = "rgba(216, 67, 21, 0.16)";
      syncStatusEl.style.color = "#fff";
      syncStatusEl.style.borderColor = "rgba(216, 67, 21, 0.4)";
    } else {
      syncStatusEl.style.background = "rgba(255,255,255,0.08)";
      syncStatusEl.style.color = "var(--paper)";
      syncStatusEl.style.borderColor = "rgba(255,255,255,0.2)";
    }
  }

  function onFirebaseReady() {
    if (loginBtn) {
      loginBtn.disabled = false;
      loginBtn.textContent = "Sign In →";
    }
    setSyncStatus("Firebase ready", "cloud");
  }

  if (window._firebaseReady) {
    onFirebaseReady();
  } else {
    document.addEventListener("firebase-ready", onFirebaseReady, { once: true });
    setTimeout(() => setSyncStatus("Offline / local only", "local"), 6000);
  }

  // ── Auth ──
  function login() {
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value;
    if (u === USER && p === PASS) {
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
      const now = new Date();
      document.getElementById("month").value = now.getMonth();
      loadData();
    } else {
      const err = document.getElementById("login-error");
      err.style.display = "block";
      document.getElementById("password").value = "";
    }
  }

  // ── Row management ──
  let rowCount = 0;

  function addRow(name = "", amount = "") {
    rowCount++;
    const div = document.createElement("div");
    div.className = "expense-row";
    const n = rowCount;
    div.innerHTML = `
      <span class="row-number">${String(n).padStart(2,'0')}</span>
      <input class="name-input" placeholder="Description" value="${escHtml(name)}">
      <span class="amount-prefix">$</span>
      <input class="amount-input" type="number" placeholder="0.00"
             value="${amount !== '' ? amount : ''}"
             oninput="updateTotal()" min="0" step="0.01">
      <button class="delete-btn" onclick="removeRow(this)" title="Remove">×</button>
    `;
    document.getElementById("rows").appendChild(div);
    updateTotal();
    // Focus name if new
    if (!name) div.querySelector(".name-input").focus();
  }

  function removeRow(btn) {
    const row = btn.closest(".expense-row");
    row.style.transition = "opacity 0.2s, transform 0.2s";
    row.style.opacity = "0";
    row.style.transform = "translateX(12px)";
    setTimeout(() => { row.remove(); updateTotal(); renumberRows(); }, 200);
  }

  function renumberRows() {
    document.querySelectorAll(".expense-row").forEach((row, i) => {
      const span = row.querySelector(".row-number");
      if (span) span.textContent = String(i + 1).padStart(2, '0');
    });
    rowCount = document.querySelectorAll(".expense-row").length;
  }

  function updateTotal() {
    let sum = 0;
    document.querySelectorAll(".amount-input").forEach(inp => {
      sum += parseFloat(inp.value) || 0;
    });
    const el = document.getElementById("total");
    el.innerHTML = `<span class="currency">$</span>${sum.toLocaleString('en-CA', {minimumFractionDigits:2, maximumFractionDigits:2})}`;
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Cloud ──
  async function save() {
    const month = document.getElementById("month").value;
    const rows = document.querySelectorAll(".expense-row");
    const data = [];
    rows.forEach(r => {
      const name = r.querySelector(".name-input").value.trim();
      const amount = parseFloat(r.querySelector(".amount-input").value) || 0;
      if (name || amount) data.push({ name, amount });
    });

    try {
      const result = await window._saveData(month, data);
      if (result.source === "cloud") {
        showToast("Saved to cloud ✓", "success");
        setSyncStatus("Cloud saved", "cloud");
      } else {
        const message = result.error?.message || "cloud unavailable";
        showToast(`Saved locally — ${message}`, "error");
        setSyncStatus("Saved locally", "local");
      }
    } catch (e) {
      console.error("Save error:", e);
      showToast(`Save failed — ${e.message || "check connection"}`, "error");
      setSyncStatus("Save failed", "error");
    }
  }

  async function loadData() {
    const month = document.getElementById("month").value;
    const container = document.getElementById("rows");
    rowCount = 0;

    container.innerHTML = "";
    addRow();

    try {
      const result = await window._loadData();
      if (result.source === "cloud") {
        if (result.snap.exists()) {
          const monthData = result.snap.data()[month];
          if (monthData && monthData.length) {
            setSyncStatus("Loaded from cloud", "cloud");
            container.innerHTML = "";
            rowCount = 0;
            monthData.forEach(d => addRow(d.name, d.amount));
            updateTotal();
            return;
          }
        }

        const localData = result.data || {};
        const localMonthData = localData[month];
        if (localMonthData && localMonthData.length) {
          setSyncStatus("Loaded from local cache", "local");
          showToast("Loaded local cache because cloud month data was missing", "error");
          container.innerHTML = "";
          rowCount = 0;
          localMonthData.forEach(d => addRow(d.name, d.amount));
          updateTotal();
          return;
        }

        showToast("No cloud data for this month", "error");
        setSyncStatus("Cloud ready — no month data", "cloud");
      } else {
        const localData = result.data || {};
        const monthData = localData[month];
        if (monthData && monthData.length) {
          container.innerHTML = "";
          rowCount = 0;
          monthData.forEach(d => addRow(d.name, d.amount));
          updateTotal();
          showToast("Loaded from local cache", "error");
          setSyncStatus("Offline — local cache", "local");
          return;
        }
        const message = result.error?.message || "cloud unavailable";
        showToast(`Could not sync from cloud — ${message}`, "error");
        setSyncStatus("Cloud unavailable", "error");
      }
    } catch (e) {
      console.error("Load error:", e);
      showToast(`Could not sync from cloud — ${e.message || "unknown error"}`, "error");
      setSyncStatus("Load failed", "error");
    }
  }

  // ── Toast ──
  let toastTimer;
  function showToast(msg, type = "success") {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = `toast ${type} show`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = "toast"; }, 2800);
  }
</script>
</body>
</html>
