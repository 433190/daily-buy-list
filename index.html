<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaspreet Expenses</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
    }

    h1, h2 {
      text-align: center;
      color: #2c3e50;
    }

    .login-box {
      max-width: 300px;
      margin: 100px auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .login-box input, .login-box button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }

    table {
      width: 90%;
      margin: 20px auto;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: center;
    }

    th {
      background-color: #2c3e50;
      color: white;
    }

    tfoot td {
      font-weight: bold;
      background: #ecf0f1;
    }

    input[type="number"], input[type="text"] {
      width: 100px;
      padding: 5px;
      text-align: center;
    }

    select, button {
      padding: 8px;
      margin: 10px;
      font-size: 14px;
    }

    button {
      background: #2c3e50;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      background: #34495e;
    }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="loginScreen" class="login-box">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="loginError" style="color:red; text-align:center;"></p>
  </div>

  <!-- Expense Tracker -->
  <div id="trackerScreen" style="display:none;">
    <h1>Jaspreet Expenses</h1>
    <h2 id="monthTitle"></h2>

    <div style="text-align:center;">
      <label for="monthSelect">Choose Month:</label>
      <select id="monthSelect" onchange="changeMonth()">
        <option value="0">January</option>
        <option value="1">February</option>
        <option value="2">March</option>
        <option value="3">April</option>
        <option value="4">May</option>
        <option value="5">June</option>
        <option value="6">July</option>
        <option value="7">August</option>
        <option value="8">September</option>
        <option value="9">October</option>
        <option value="10">November</option>
        <option value="11">December</option>
      </select>
    </div>

    <table id="expenseTable">
      <thead>
        <tr>
          <th>Expense Name</th>
          <th>Amount ($)</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input type="text" value="Mobile Payment" onchange="updateTotal()"></td>
          <td><input type="number" value="50" onchange="updateTotal()"></td>
        </tr>
        <tr>
          <td><input type="text" value="Car Insurance" onchange="updateTotal()"></td>
          <td><input type="number" value="120" onchange="updateTotal()"></td>
        </tr>
        <tr>
          <td><input type="text" value="Study Loan" onchange="updateTotal()"></td>
          <td><input type="number" value="300" onchange="updateTotal()"></td>
        </tr>
        <tr>
          <td><input type="text" value="Equifax Payment" onchange="updateTotal()"></td>
          <td><input type="number" value="20" onchange="updateTotal()"></td>
        </tr>
        <tr>
          <td><input type="text" value="Amazon Payment" onchange="updateTotal()"></td>
          <td><input type="number" value="40" onchange="updateTotal()"></td>
        </tr>
        <tr>
          <td><input type="text" value="Apple Payment" onchange="updateTotal()"></td>
          <td><input type="number" value="15" onchange="updateTotal()"></td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td>Total</td>
          <td id="totalAmount">545</td>
        </tr>
      </tfoot>
    </table>

    <div style="text-align:center;">
      <button onclick="saveMonth()">💾 Save</button>
    </div>
  </div>

  <script>
    const correctUser = "jaspreet";
    const correctPass = "1234";

    function login() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      if (user === correctUser && pass === correctPass) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("trackerScreen").style.display = "block";
        changeMonth();
      } else {
        document.getElementById("loginError").innerText = "Invalid username or password!";
      }
    }

    function updateTotal() {
      const tbody = document.querySelectorAll("#expenseTable tbody tr");
      let total = 0;
      tbody.forEach(row => {
        const amount = parseFloat(row.cells[1].children[0].value) || 0;
        total += amount;
      });
      document.getElementById("totalAmount").innerText = total.toFixed(2);
    }

    function saveMonth() {
      const month = document.getElementById("monthSelect").value;
      const tbody = document.querySelectorAll("#expenseTable tbody tr");
      let expenses = [];
      tbody.forEach(row => {
        expenses.push({
          name: row.cells[0].children[0].value,
          amount: row.cells[1].children[0].value
        });
      });
      localStorage.setItem("expenses_" + month, JSON.stringify(expenses));
      alert("Expenses saved for " + document.getElementById("monthTitle").innerText);
    }

    function changeMonth() {
      const month = document.getElementById("monthSelect").value;
      const monthNames = [
        "January","February","March","April","May","June",
        "July","August","September","October","November","December"
      ];
      document.getElementById("monthTitle").innerText = monthNames[month] + " Expenses";

      const saved = localStorage.getItem("expenses_" + month);
      const tbody = document.querySelectorAll("#expenseTable tbody tr");
      if (saved) {
        const expenses = JSON.parse(saved);
        tbody.forEach((row, i) => {
          row.cells[0].children[0].value = expenses[i].name || "";
          row.cells[1].children[0].value = expenses[i].amount || 0;
        });
      } else {
        tbody.forEach(row => {
          row.cells[0].children[0].value = "";
          row.cells[1].children[0].value = 0;
        });
      }
      updateTotal();
    }

    // Load current month
    const today = new Date();
    document.getElementById("monthSelect").value = today.getMonth();
  </script>

</body>
</html>
