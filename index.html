<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaspreet Expenses</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
    }

    table {
      width: 80%;
      margin: 20px auto;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: center;
    }

    th {
      background-color: #2c3e50;
      color: white;
    }

    tfoot td {
      font-weight: bold;
      background: #ecf0f1;
    }

    .add-expense {
      display: flex;
      justify-content: center;
      margin: 20px 0;
      gap: 10px;
    }

    input, button {
      padding: 8px;
      font-size: 14px;
    }

    button {
      background: #2c3e50;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    button:hover {
      background: #34495e;
    }
  </style>
</head>
<body>

  <h1>Jaspreet Expenses</h1>

  <table id="expenseTable">
    <thead>
      <tr>
        <th>Expense Name</th>
        <th>Amount ($)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>Mobile Payment</td><td>50</td></tr>
      <tr><td>Car Insurance</td><td>120</td></tr>
      <tr><td>Study Loan</td><td>300</td></tr>
      <tr><td>Equifax Payment</td><td>20</td></tr>
      <tr><td>Amazon Payment</td><td>40</td></tr>
      <tr><td>Apple Payment</td><td>15</td></tr>
    </tbody>
    <tfoot>
      <tr>
        <td>Total</td>
        <td id="totalAmount">545</td>
      </tr>
    </tfoot>
  </table>

  <div class="add-expense">
    <input type="text" id="expenseName" placeholder="Expense Name">
    <input type="number" id="expenseAmount" placeholder="Amount">
    <button onclick="addExpense()">Add Expense</button>
  </div>

  <script>
    function addExpense() {
      const name = document.getElementById("expenseName").value;
      const amount = parseFloat(document.getElementById("expenseAmount").value);
      if (name && amount) {
        const table = document.getElementById("expenseTable").getElementsByTagName("tbody")[0];
        const newRow = table.insertRow();
        newRow.insertCell(0).innerText = name;
        newRow.insertCell(1).innerText = amount;

        updateTotal(amount);

        document.getElementById("expenseName").value = "";
        document.getElementById("expenseAmount").value = "";
      } else {
        alert("Please enter both name and amount!");
      }
    }

    function updateTotal(amount) {
      const totalCell = document.getElementById("totalAmount");
      totalCell.innerText = parseFloat(totalCell.innerText) + amount;
    }
  </script>

</body>
</html>
