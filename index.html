<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaspreet Expenses</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 10px;
    }

    h2 {
      text-align: center;
      color: #34495e;
      margin-top: 0;
    }

    table {
      width: 90%;
      margin: 20px auto;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: center;
    }

    th {
      background-color: #2c3e50;
      color: white;
    }

    tfoot td {
      font-weight: bold;
      background: #ecf0f1;
    }

    input[type="number"] {
      width: 80px;
      padding: 5px;
      text-align: center;
    }

    select {
      padding: 8px;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>Jaspreet Expenses</h1>
  <h2 id="monthTitle"></h2>

  <div style="text-align:center;">
    <label for="monthSelect">Choose Month:</label>
    <select id="monthSelect" onchange="changeMonth()">
      <option value="0">January</option>
      <option value="1">February</option>
      <option value="2">March</option>
      <option value="3">April</option>
      <option value="4">May</option>
      <option value="5">June</option>
      <option value="6">July</option>
      <option value="7">August</option>
      <option value="8">September</option>
      <option value="9">October</option>
      <option value="10">November</option>
      <option value="11">December</option>
    </select>
  </div>

  <table id="expenseTable">
    <thead>
      <tr>
        <th>Expense Name</th>
        <th>Amount ($)</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>Mobile Payment</td><td><input type="number" value="50" onchange="updateTotal()"></td></tr>
      <tr><td>Car Insurance</td><td><input type="number" value="120" onchange="updateTotal()"></td></tr>
      <tr><td>Study Loan</td><td><input type="number" value="300" onchange="updateTotal()"></td></tr>
      <tr><td>Equifax Payment</td><td><input type="number" value="20" onchange="updateTotal()"></td></tr>
      <tr><td>Amazon Payment</td><td><input type="number" value="40" onchange="updateTotal()"></td></tr>
      <tr><td>Apple Payment</td><td><input type="number" value="15" onchange="updateTotal()"></td></tr>
    </tbody>
    <tfoot>
      <tr>
        <td>Total</td>
        <td id="totalAmount">545</td>
      </tr>
    </tfoot>
  </table>

  <script>
    // Store monthly expenses
    let monthlyData = Array.from({length: 12}, () => []);

    function updateTotal() {
      const inputs = document.querySelectorAll("#expenseTable tbody input");
      let total = 0;
      inputs.forEach((input, i) => {
        const value = parseFloat(input.value) || 0;
        total += value;
        // save in monthlyData
        const month = document.getElementById("monthSelect").value;

      });
      document.getElementById("totalAmount").innerText = total.toFixed(2);
    }

    function changeMonth() {
      const month = document.getElementById("monthSelect").value;
      const monthNames = [
        "January","February","March","April","May","June",
        "July","August","September","October","November","December"
      ];
      document.getElementById("monthTitle").innerText = monthNames[month] + " Expenses";

      // Load saved values
      const inputs = document.querySelectorAll("#expenseTable tbody input");
      inputs.forEach((input, i) => {
        input.value = monthlyData[month][i] || 0;
      });
      updateTotal();
    }

    // Initialize page with current month
    const today = new Date();
    document.getElementById("monthSelect").value = today.getMonth();
    changeMonth();
  </script>

</body>
</html>
