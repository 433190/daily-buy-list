<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaspreet Expenses</title>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCYtszBHTirQzuAmJhmh2SkqisYnL-0JKw",
    authDomain: "expense-tracker-c3638.firebaseapp.com",
    projectId: "expense-tracker-c3638",
    storageBucket: "expense-tracker-c3638.firebasestorage.app",
    messagingSenderId: "851054016055",
    appId: "1:851054016055:web:769f45050c7f159c9f71b2"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.db = db;
</script>

<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px }
input { padding:8px; margin:5px }
button { padding:8px 12px; margin:5px }
.row { display:flex; gap:10px; margin-bottom:10px }
</style>
</head>

<body>

<h2>Expense Tracker</h2>

<div id="login">
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="app" style="display:none;">
  <select id="month" onchange="loadData()">
    <option value="0">Jan</option>
    <option value="1">Feb</option>
    <option value="2">Mar</option>
    <option value="3">Apr</option>
    <option value="4">May</option>
    <option value="5">Jun</option>
    <option value="6">Jul</option>
    <option value="7">Aug</option>
    <option value="8">Sep</option>
    <option value="9">Oct</option>
    <option value="10">Nov</option>
    <option value="11">Dec</option>
  </select>

  <div id="rows"></div>

  <button onclick="addRow()">Add</button>
  <button onclick="save()">Save</button>
</div>

<script>
const user = "jaspreet";
const pass = "1234";

function login() {
  if (
    document.getElementById("username").value === user &&
    document.getElementById("password").value === pass
  ) {
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
    loadData();
  } else {
    alert("Wrong login");
  }
}

function addRow(name="", amount="") {
  const div = document.createElement("div");
  div.className = "row";

  div.innerHTML = `
    <input class="name" placeholder="Expense" value="${name}">
    <input class="amount" type="number" placeholder="Amount" value="${amount}">
    <button onclick="this.parentElement.remove()">X</button>
  `;

  document.getElementById("rows").appendChild(div);
}

async function save() {
  const month = document.getElementById("month").value;
  const rows = document.querySelectorAll(".row");

  const data = [];
  rows.forEach(r => {
    data.push({
      name: r.querySelector(".name").value,
      amount: parseFloat(r.querySelector(".amount").value) || 0
    });
  });

  await setDoc(doc(window.db, "users", user), {
    [month]: data
  }, { merge: true });

  alert("Saved to cloud ✅");
}

async function loadData() {
  const month = document.getElementById("month").value;
  const container = document.getElementById("rows");
  container.innerHTML = "";

  const docSnap = await getDoc(doc(window.db, "users", user));

  if (docSnap.exists()) {
    const data = docSnap.data()[month];

    if (data) {
      data.forEach(d => addRow(d.name, d.amount));
    } else {
      addRow();
    }
  } else {
    addRow();
  }
}
</script>

</body>
</html>
